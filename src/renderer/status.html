<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self'"
    />
    <title>Status</title>
    <link rel="stylesheet" href="./status.css" />
  </head>
  <body>
    <div class="status" id="card" data-state="idle">
      <div class="label"><span class="dot"></span><span id="label">Idle</span></div>
      <div class="body">
        <span class="dot"></span>
        <div class="message" id="message">Ready</div>
        <div class="actions">
          <button id="cancel" title="Cancel" type="button" tabindex="-1">x</button>
          <span class="wave" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </span>
          <button id="accept" title="Insert text" type="button" tabindex="-1">&#10003;</button>
        </div>
      </div>
    </div>
    <script src="./status.js"></script>
  </body>
</html>
