<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self'"
    />
    <title>BayanFlow</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./dock.css" />
  </head>
  <body>
    <main id="dock" class="dock" data-view="hidden">
      <section id="view-idle" class="pill" hidden>
        <div class="pill-side pill-side-left">
          <button id="pillDictate" class="btn btn-quiet" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M8 2.5a1.8 1.8 0 0 1 1.8 1.8v3.4a1.8 1.8 0 1 1-3.6 0V4.3A1.8 1.8 0 0 1 8 2.5zM4.3 7.4a3.7 3.7 0 0 0 7.4 0M8 11.4v2.1"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
            <span>Dictate</span>
          </button>
          <button id="pillRewrite" class="btn btn-quiet" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M3 13l7-7 3 3-7 7H3v-3zM10.5 2.5l3 3"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>Rewrite</span>
          </button>
        </div>

        <button id="pillCore" class="pill-core" type="button" title="Click to dictate">
          <span id="pillDot" class="pill-dot" aria-hidden="true"></span>
          <span class="pill-bars" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>

        <div class="pill-side pill-side-right">
          <button id="pillSettings" class="btn btn-icon btn-quiet" type="button" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="8" cy="8" r="2.1" fill="none" stroke="currentColor" stroke-width="1.5" />
              <path
                d="M8 1.8v1.6M8 12.6v1.6M14.2 8h-1.6M3.4 8H1.8M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1M12.4 12.4l-1.1-1.1M4.7 4.7L3.6 3.6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button id="pillSnooze" class="btn btn-icon btn-quiet" type="button" title="Hide for 1 hour" aria-label="Hide for 1 hour">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </section>

      <section id="view-listening" class="bar" hidden>
        <span class="wave" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </span>
        <span id="listenTimer" class="timer">0:00</span>
        <span id="listenHint" class="hint"></span>
        <span class="spacer"></span>
        <button id="listenStop" class="btn btn-primary" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5" /></svg>
          <span>Finish</span>
        </button>
        <button id="listenCancel" class="btn btn-icon" type="button" title="Cancel (Esc)" aria-label="Cancel">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </section>

      <section id="view-working" class="bar" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="workingLabel" class="label">Working</span>
        <span id="workingElapsed" class="timer"></span>
        <span class="spacer"></span>
        <button id="workingCancel" class="btn btn-icon" type="button" title="Cancel" aria-label="Cancel">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </section>

      <section id="view-done" class="bar" hidden>
        <span id="doneDot" class="dot" aria-hidden="true"></span>
        <span id="doneLabel" class="label">Pasted</span>
        <span class="spacer"></span>
        <button id="doneRedo" class="btn" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M13 8a5 5 0 1 1-1.6-3.7M13 2v3h-3"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>Redo</span>
        </button>
        <button id="donePolish" class="btn" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M3 13l7-7 3 3-7 7H3v-3zM10.5 2.5l3 3"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>Polish</span>
        </button>
        <button id="doneClose" class="btn btn-icon" type="button" title="Close" aria-label="Close">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </section>

      <section id="view-menu" class="panel" hidden>
        <header class="panel-head">
          <span class="panel-title">Rewrite</span>
          <span id="menuNote" class="hint"></span>
          <span class="spacer"></span>
          <button id="menuClose" class="btn btn-icon" type="button" title="Close (Esc)" aria-label="Close">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
        </header>
        <div id="menuActions" class="action-grid"></div>
        <div id="customRow" class="custom-row" hidden>
          <input id="customInput" type="text" placeholder="Tell BayanFlow what to do with this text" maxlength="500" />
          <button id="customRun" class="btn btn-primary" type="button"><span>Run</span></button>
        </div>
      </section>

      <section id="view-error" class="bar bar-error" hidden>
        <span class="dot dot-danger" aria-hidden="true"></span>
        <span id="errorMessage" class="label label-wrap">Something went wrong</span>
        <span class="spacer"></span>
        <button id="errorAction" class="btn btn-primary" type="button" hidden><span id="errorActionLabel">Retry</span></button>
        <button id="errorClose" class="btn btn-icon" type="button" title="Dismiss" aria-label="Dismiss">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </section>
    </main>
    <script src="./dock.js"></script>
  </body>
</html>
