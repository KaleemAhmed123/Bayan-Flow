<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self'"
    />
    <title>BayanFlow Settings</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main>
      <h1>BayanFlow Settings</h1>
      <p class="subtitle">Configure dictation, cleanup, and insertion behavior.</p>

      <section class="panel">
        <ul class="health" id="health"></ul>
      </section>

      <section class="panel">
        <label for="groqApiKey">Groq API key</label>
        <input id="groqApiKey" type="password" autocomplete="off" />

        <label for="hotkey">Activation hotkey</label>
        <input id="hotkey" type="text" />

        <button class="secondary" id="testMic" type="button">Test microphone</button>
      </section>

      <section class="panel">
        <label for="transcriptionModel">Transcription model</label>
        <input id="transcriptionModel" type="text" />

        <label for="cleanupModel">Cleanup model</label>
        <input id="cleanupModel" type="text" />
      </section>

      <section class="panel">
        <label class="row">
          <input id="autoPaste" type="checkbox" />
          Paste automatically after recording stops
        </label>
        <div class="warning" id="autoPasteWarning" hidden>
          Auto-paste sends text to the active window after recording. BayanFlow verifies the original window handle when available and falls back to title matching; if the target changes, the text stays copied instead.
          <label class="row compact">
            <input id="autoPasteConfirmed" type="checkbox" />
            I understand auto-paste may paste into the wrong app if Windows cannot verify the target.
          </label>
        </div>

        <label class="row">
          <input id="cleanupEnabled" type="checkbox" />
          Clean transcript with AI before inserting
        </label>

        <label class="row">
          <input id="openAtLogin" type="checkbox" />
          Start BayanFlow when I sign in
        </label>

      </section>

      <button id="save">Save</button>
      <span class="status" id="status"></span>
    </main>
    <script src="./settings.js"></script>
  </body>
</html>
